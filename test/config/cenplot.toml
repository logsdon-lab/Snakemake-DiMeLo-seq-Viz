[settings]
format = [ "png", "pdf",]
transparent = false
dim = [ 10, 4,]
legend_prop = 0.05
axis_h_pad = 0.01
dpi = 600
legend_pos = "left"
layout = "constrained"

# 1
[[tracks]]
position = "relative"
proportion = 0.025
type = "label"
path = "sat_annot"

[tracks.options]
legend = true
hide_x = true
legend_title = "Structure"
legend_title_only = true

# 2
[[tracks]]
position = "relative"
type = "bar"
proportion = 0.05
path = "dimelo"

[tracks.options]
hide_x = true
ymin = 0
ymax = 10.0
legend_title = "Normalized CENP-A\nDiMeLo-Seq signals\n(relative to IgG)"
legend_title_only = true

# 3
[[tracks]]
position = "relative"
type = "line"
proportion = 0.05
path = "cov_treatment"

[tracks.options]
hide_x = true
legend = true
label = "CENP-A read depth (X)"
linestyle = "none"
color = "orange"
marker = "o"
markersize = 2
ymin = 0
legend_ncols = 1

# 4
[[tracks]]
position = "relative"
type = "line"
proportion = 0.05
path = "cov_ctrl"

[tracks.options]
hide_x = false
legend = true
label = "IgG read depth (X)"
linestyle = "none"
color = "blue"
marker = "o"
markersize = 2
ymin = 0
legend_ncols = 1

# 5
[[tracks]]
position = "relative"
proportion = 0.025
type = "legend"

[tracks.options]
index = 0
