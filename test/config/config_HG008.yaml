
min_read_length: 0
samples:
  - name: HG008
    asm_fa: test/data/HG008-N_chr16_H2.fa.gz
    bed: test/data/HG008-N_chr16_H2.bed
    # tracks:
    #   sat_annot: test/data/NA20355_chr8_sat_annot.bed.gz
    cfg_cenplot: test/config/cenplot_HG008.toml
    modification: CG
    treatment:
      name: Tumor
      reads:
      - test/data/HG008-T_chr16_H2.bam
    control:
      name: Normal
      reads:
      - test/data/HG008-N_chr16_H2.bam

# winnowmap, pbmm2, or minimap2
# aligner_opts is optional. See README.md for defaults.
aligner: "minimap2"
aligner_opts: "-y -a --eqx --cs -x lr:hqae -I8g -s 4000"
output_dir: "test/results/align"
logs_dir: "test/logs/align"
benchmarks_dir: "test/benchmarks/align"
threads_aln: 24
mem_aln: 50G
samtools_view_flag: 2308
